# Solo configuración de herramientas. Las dependencias están en requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs típicos · UP: sintaxis moderna · S: seguridad
select = ["E", "F", "I", "B", "UP", "S"]
# E501 (línea demasiado larga) desactivada: los comentarios largos son apuntes a propósito.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# En los tests es normal usar assert y claves falsas.
"tests/**" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite que los tests importen asistente_ia desde la raíz del proyecto.
pythonpath = ["."]
